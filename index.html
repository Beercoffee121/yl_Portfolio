<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="产品设计、业务系统与智能应用项目作品集。">
  <title>项目作品集 | YL Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <script src="content.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#projects">跳转到项目</a>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#top" class="brand">YL <span>/ Portfolio</span></a>
      <nav class="nav" aria-label="主导航">
        <a href="#projects">项目</a>
        <a id="github-nav" href="https://github.com/Beercoffee121/yl_Portfolio" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero container" aria-labelledby="site-title">
      <p class="eyebrow" id="site-eyebrow">PORTFOLIO · 2026</p>
      <h1 id="site-title">项目作品集</h1>
      <p class="hero-description" id="site-description">收录产品设计、业务系统与智能应用相关项目，展示项目背景、核心方案、主要设计内容与体验方式。</p>
      <div class="hero-links">
        <a class="button button-primary" href="#projects">查看项目 <span aria-hidden="true">↓</span></a>
        <a id="github-hero" class="button button-outline" href="https://github.com/Beercoffee121/yl_Portfolio" target="_blank" rel="noopener noreferrer">GitHub 仓库 ↗</a>
      </div>
    </section>

    <section id="projects" class="section container" aria-labelledby="projects-heading">
      <div class="section-heading"><span class="section-number">01</span><h2 id="projects-heading">项目一览</h2></div>
      <div class="project-grid" id="project-grid"></div>
    </section>

    <section id="details" class="section container" aria-labelledby="details-heading">
      <div class="section-heading"><span class="section-number">02</span><h2 id="details-heading">项目详情</h2></div>
      <div id="project-details"></div>
    </section>

  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span id="footer-note">独立作品集 · 2026</span>
      <a href="#top">返回顶部 ↑</a>
    </div>
  </footer>

  <dialog class="image-dialog" id="image-dialog" aria-label="工作流截图放大查看">
    <div class="dialog-header">
      <strong id="dialog-title">工作流截图</strong>
      <button type="button" class="dialog-close" id="dialog-close">关闭 ×</button>
    </div>
    <div class="dialog-body"><img id="dialog-image" alt="工作流大图"></div>
  </dialog>
  <noscript><p class="container">此页面需要启用 JavaScript 才能显示项目内容。</p></noscript>
</body>
</html>
